<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Stellar Sweep</title>
  <style>
    :root {
      --bg: #070b14;
      --panel: #10182a;
      --cyan: #5ce1ff;
      --pink: #ff5cad;
      --gold: #ffd166;
      --text: #e8f1ff;
      --muted: #8aa0c4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: radial-gradient(1200px 800px at 50% -10%, #15203a 0%, var(--bg) 55%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
    }
    h1 {
      font-size: 1.35rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--cyan);
      text-shadow: 0 0 18px rgba(92, 225, 255, 0.45);
    }
    .hud {
      width: min(720px, 96vw);
      display: flex;
      justify-content: space-between;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .hud b { color: var(--gold); font-weight: 700; }
    .wrap {
      position: relative;
      width: min(720px, 96vw);
      height: min(560px, 70vh);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(92, 225, 255, 0.25), 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    canvas { display: block; width: 100%; height: 100%; background: #050814; touch-action: none; }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(7, 11, 20, 0.72);
      backdrop-filter: blur(4px);
      text-align: center;
      padding: 24px;
    }
    .overlay.hidden { display: none; }
    .overlay p { color: var(--muted); max-width: 420px; line-height: 1.45; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      color: #061018;
      background: linear-gradient(135deg, var(--cyan), #7dffb3);
      box-shadow: 0 0 24px rgba(92, 225, 255, 0.35);
    }
    button:hover { filter: brightness(1.08); }
    .hint { color: var(--muted); font-size: 0.85rem; }
    kbd {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid #3a4c6e;
      background: #162033;
      color: var(--text);
      font-size: 0.8em;
    }
  </style>
</head>
<body>
  <h1>Stellar Sweep</h1>
  <div class="hud">
    <span>Score <b id="score">0</b></span>
    <span>Best <b id="best">0</b></span>
    <span>Lives <b id="lives">3</b></span>
  </div>
  <div class="wrap">
    <canvas id="game" width="720" height="560"></canvas>
    <div class="overlay" id="start">
      <h2>Collect stars. Dodge rocks.</h2>
      <p>Move with <kbd>A</kbd>/<kbd>D</kbd> or arrows. Shoot with <kbd>Space</kbd> or click. On a phone, drag to fly and tap to fire.</p>
      <button id="play">Play</button>
    </div>
    <div class="overlay hidden" id="over">
      <h2>Ship down</h2>
      <p>Final score: <b id="final">0</b></p>
      <button id="again">Play again</button>
    </div>
  </div>
  <p class="hint">Stars +10 · Rock hit −1 life · Enemies drop extra points when shot</p>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;

    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const livesEl = document.getElementById("lives");
    const startEl = document.getElementById("start");
    const overEl = document.getElementById("over");
    const finalEl = document.getElementById("final");

    const BEST_KEY = "stellar-sweep-best";
    let best = Number(localStorage.getItem(BEST_KEY) || 0);
    bestEl.textContent = best;

    const keys = new Set();
    let pointerX = W / 2;
    let pointerDown = false;
    let running = false;
    let last = 0;

    const state = {
      score: 0,
      lives: 3,
      t: 0,
      ship: { x: W / 2, y: H - 70, vx: 0, flash: 0 },
      bullets: [],
      stars: [],
      rocks: [],
      enemies: [],
      particles: [],
      cooldown: 0,
      spawnStar: 0,
      spawnRock: 0,
      spawnEnemy: 0,
    };

    function reset() {
      state.score = 0;
      state.lives = 3;
      state.t = 0;
      state.ship = { x: W / 2, y: H - 70, vx: 0, flash: 0 };
      state.bullets = [];
      state.stars = [];
      state.rocks = [];
      state.enemies = [];
      state.particles = [];
      state.cooldown = 0;
      state.spawnStar = 0;
      state.spawnRock = 0.4;
      state.spawnEnemy = 2;
      syncHud();
    }

    function syncHud() {
      scoreEl.textContent = state.score;
      livesEl.textContent = state.lives;
      if (state.score > best) {
        best = state.score;
        localStorage.setItem(BEST_KEY, String(best));
        bestEl.textContent = best;
      }
    }

    function burst(x, y, color, n = 12) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 40 + Math.random() * 180;
        state.particles.push({
          x, y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: 0.4 + Math.random() * 0.4,
          color,
        });
      }
    }

    function shoot() {
      if (state.cooldown > 0) return;
      state.cooldown = 0.18;
      state.bullets.push({ x: state.ship.x, y: state.ship.y - 22, vy: -520 });
    }

    function hit(a, b, r) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return dx * dx + dy * dy < r * r;
    }

    function damage() {
      state.lives -= 1;
      state.ship.flash = 0.6;
      burst(state.ship.x, state.ship.y, "#ff5cad", 18);
      syncHud();
      if (state.lives <= 0) {
        running = false;
        finalEl.textContent = state.score;
        overEl.classList.remove("hidden");
      }
    }

    function update(dt) {
      state.t += dt;
      const difficulty = 1 + state.t * 0.04;

      let ax = 0;
      if (keys.has("ArrowLeft") || keys.has("a") || keys.has("A")) ax -= 1;
      if (keys.has("ArrowRight") || keys.has("d") || keys.has("D")) ax += 1;
      if (pointerDown) {
        const dx = pointerX - state.ship.x;
        ax += Math.max(-1, Math.min(1, dx / 80));
      }
      state.ship.vx += ax * 2400 * dt;
      state.ship.vx *= Math.pow(0.001, dt);
      state.ship.x += state.ship.vx * dt;
      state.ship.x = Math.max(28, Math.min(W - 28, state.ship.x));
      state.ship.flash = Math.max(0, state.ship.flash - dt);
      state.cooldown = Math.max(0, state.cooldown - dt);
      if (keys.has(" ") || pointerDown) shoot();

      state.spawnStar -= dt;
      if (state.spawnStar <= 0) {
        state.stars.push({
          x: 30 + Math.random() * (W - 60),
          y: -20,
          vy: 90 + Math.random() * 70,
          r: 7,
        });
        state.spawnStar = 0.55 / difficulty;
      }

      state.spawnRock -= dt;
      if (state.spawnRock <= 0) {
        state.rocks.push({
          x: 30 + Math.random() * (W - 60),
          y: -30,
          vy: 110 + Math.random() * 90 * difficulty,
          r: 14 + Math.random() * 16,
          rot: Math.random() * 6,
          vr: (Math.random() - 0.5) * 3,
        });
        state.spawnRock = 0.7 / difficulty;
      }

      state.spawnEnemy -= dt;
      if (state.spawnEnemy <= 0) {
        state.enemies.push({
          x: 40 + Math.random() * (W - 80),
          y: -24,
          vy: 70 + Math.random() * 40,
          wobble: Math.random() * 6,
        });
        state.spawnEnemy = 2.2 / difficulty;
      }

      for (const b of state.bullets) b.y += b.vy * dt;
      state.bullets = state.bullets.filter((b) => b.y > -20);

      for (const s of state.stars) s.y += s.vy * dt;
      for (const r of state.rocks) {
        r.y += r.vy * dt;
        r.rot += r.vr * dt;
      }
      for (const e of state.enemies) {
        e.y += e.vy * dt;
        e.x += Math.sin(state.t * 3 + e.wobble) * 70 * dt;
        e.x = Math.max(24, Math.min(W - 24, e.x));
      }

      for (const s of state.stars) {
        if (hit(state.ship, s, 28)) {
          s.dead = true;
          state.score += 10;
          burst(s.x, s.y, "#ffd166", 10);
          syncHud();
        }
      }
      state.stars = state.stars.filter((s) => !s.dead && s.y < H + 30);

      for (const r of state.rocks) {
        if (state.ship.flash <= 0 && hit(state.ship, r, r.r + 16)) {
          r.dead = true;
          damage();
        }
        for (const b of state.bullets) {
          if (hit(b, r, r.r + 6)) {
            b.y = -999;
            r.dead = true;
            state.score += 5;
            burst(r.x, r.y, "#8aa0c4", 14);
            syncHud();
          }
        }
      }
      state.rocks = state.rocks.filter((r) => !r.dead && r.y < H + 40);

      for (const e of state.enemies) {
        if (state.ship.flash <= 0 && hit(state.ship, e, 28)) {
          e.dead = true;
          damage();
        }
        for (const b of state.bullets) {
          if (hit(b, e, 20)) {
            b.y = -999;
            e.dead = true;
            state.score += 25;
            burst(e.x, e.y, "#ff5cad", 16);
            syncHud();
          }
        }
      }
      state.enemies = state.enemies.filter((e) => !e.dead && e.y < H + 30);

      for (const p of state.particles) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 80 * dt;
        p.life -= dt;
      }
      state.particles = state.particles.filter((p) => p.life > 0);
    }

    function drawBg() {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#0b1224");
      g.addColorStop(1, "#050814");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      for (let i = 0; i < 40; i++) {
        const x = (i * 97 + state.t * 18) % W;
        const y = (i * 53 + state.t * 90) % H;
        ctx.fillRect(x, y, 1.5, 1.5);
      }
    }

    function drawShip() {
      const { x, y, flash } = state.ship;
      ctx.save();
      ctx.translate(x, y);
      ctx.shadowColor = flash > 0 ? "#ff5cad" : "#5ce1ff";
      ctx.shadowBlur = 18;
      ctx.fillStyle = flash > 0 && Math.floor(flash * 20) % 2 === 0 ? "#ffb3d6" : "#dff9ff";
      ctx.beginPath();
      ctx.moveTo(0, -22);
      ctx.lineTo(16, 16);
      ctx.lineTo(0, 8);
      ctx.lineTo(-16, 16);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#5ce1ff";
      ctx.fillRect(-3, 10, 6, 10 + Math.sin(state.t * 30) * 3);
      ctx.restore();
    }

    function draw() {
      drawBg();
      for (const s of state.stars) {
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(state.t * 2);
        ctx.fillStyle = "#ffd166";
        ctx.shadowColor = "#ffd166";
        ctx.shadowBlur = 12;
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const a = (i * Math.PI) / 5 - Math.PI / 2;
          const r = i % 2 === 0 ? 8 : 3.5;
          ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      for (const r of state.rocks) {
        ctx.save();
        ctx.translate(r.x, r.y);
        ctx.rotate(r.rot);
        ctx.fillStyle = "#4a5a78";
        ctx.strokeStyle = "#8aa0c4";
        ctx.beginPath();
        for (let i = 0; i < 7; i++) {
          const a = (i / 7) * Math.PI * 2;
          const rad = r.r * (0.75 + (i % 2) * 0.25);
          ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
      for (const e of state.enemies) {
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.fillStyle = "#ff5cad";
        ctx.shadowColor = "#ff5cad";
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.moveTo(0, 16);
        ctx.lineTo(14, -12);
        ctx.lineTo(0, -4);
        ctx.lineTo(-14, -12);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = "#e8f1ff";
      ctx.shadowColor = "#5ce1ff";
      ctx.shadowBlur = 10;
      for (const b of state.bullets) {
        ctx.fillRect(b.x - 2, b.y - 10, 4, 16);
      }
      ctx.shadowBlur = 0;
      for (const p of state.particles) {
        ctx.globalAlpha = Math.max(0, p.life * 2);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      }
      ctx.globalAlpha = 1;
      drawShip();
    }

    function loop(ts) {
      if (!running) return;
      const dt = Math.min(0.033, (ts - last) / 1000 || 0.016);
      last = ts;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    function start() {
      reset();
      startEl.classList.add("hidden");
      overEl.classList.add("hidden");
      running = true;
      last = performance.now();
      requestAnimationFrame(loop);
    }

    document.getElementById("play").onclick = start;
    document.getElementById("again").onclick = start;

    window.addEventListener("keydown", (e) => {
      keys.add(e.key);
      if (e.key === " " || e.key.startsWith("Arrow")) e.preventDefault();
      if (!running && (e.key === "Enter" || e.key === " ")) start();
    });
    window.addEventListener("keyup", (e) => keys.delete(e.key));

    function setPointer(clientX) {
      const rect = canvas.getBoundingClientRect();
      pointerX = ((clientX - rect.left) / rect.width) * W;
    }
    canvas.addEventListener("pointerdown", (e) => {
      pointerDown = true;
      setPointer(e.clientX);
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener("pointermove", (e) => {
      if (pointerDown) setPointer(e.clientX);
    });
    window.addEventListener("pointerup", () => { pointerDown = false; });

    drawBg();
    drawShip();
  </script>
</body>
</html>
